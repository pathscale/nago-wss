[package]
name = "nago-wss"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "RFC 6455 WebSockets without tokio: a sans-io protocol core plus its own reactor"
repository = "https://github.com/pathscale/nago-wss"
keywords = ["websocket", "no-std", "sans-io", "rfc6455", "async"]
categories = ["network-programming", "web-programming::websocket", "no-std"]

[features]
# The protocol core alone. No I/O, no allocator beyond `alloc`, no platform.
default = ["std", "reactor", "tls", "webpki-roots", "simd-utf8"]
std = ["simdutf8?/std"]
# The readiness reactor: kqueue/epoll, sockets, and the futures over them.
# Needs `std` for `io::Error` and owned descriptors.
reactor = ["std", "dep:nagoya", "dep:libc"]
# wss:// rather than ws://. Pulls in rustls, which is sans-io, so this is glue
# rather than a second I/O stack.
tls = ["reactor", "dep:nago-rustls"]
# Validate text frames with vector instructions rather than the standard
# library's byte loop. On by default, because it is not a small difference:
# measured on this machine against `core::str::from_utf8` over the same 16 KiB
# buffers, 57.37 GB/s to 115.84 on ASCII and 2.56 GB/s to 13.49 on mixed text.
# Real traffic is the second case, and a five times slower validator on every
# text frame is not a sensible thing to have to ask for.
#
# It remains a feature because the crate it uses contains `unsafe`, and `proto`
# forbids `unsafe` of its own. A consumer with a no-unsafe policy turns it off
# with `default-features = false` and loses only speed: the fallback is the
# standard library's validator, which is correct, just scalar.
simd-utf8 = ["dep:simdutf8"]
# The bundled trust anchors, forwarded from nago-rustls. Off, a caller
# supplies its own configuration.
webpki-roots = ["tls", "nago-rustls/webpki-roots"]

[dependencies]
# SIMD UTF-8 validation. A feature because the protocol core forbids `unsafe`
# and this crate does not: a consumer with that policy turns it off and gets
# the standard library's validator. Measured over the same 16 KiB buffers,
# 57.37 GB/s against 115.84 on ASCII and 2.56 GB/s against 13.49 on mixed
# text, which is why it is on by default.
#
# `ps-simdutf8` is upstream with one change: the x86 dispatch asks `cpuid`
# through `cpufeatures` rather than `std::is_x86_feature_detected!`, which was
# the only reason the crate wanted `std` on x86. Its `std` feature is now one
# `impl std::error::Error` and gates nothing else, so it defaults to empty and
# this line needs no `default-features = false`. That matters: on upstream the
# line was mandatory to stay `no_std`, and it reads exactly like the mistake of
# switching the SIMD off by accident.
#
# `std` above forwards to it with `simdutf8?/std`, so a hosted build gets the
# `Error` impl and a `no_std` one does not, while both get the vector paths.
# The package is renamed and the library is not, so `use simdutf8::...` and the
# call in `proto::message` are unchanged.
simdutf8 = { package = "ps-simdutf8", version = "0.1.6", optional = true }
# Payload ownership. `Bytes` is what endpoint-libs' WireMessage already carries,
# so a frame payload crosses the seam without a copy or a reallocation.
bytes = { version = "1.7", default-features = false }

# TLS, as its own crate. The loop that drives rustls turned out to have
# nothing to do with WebSockets, so it lives in nago-rustls and this crate is
# one of its consumers rather than its owner.
# PATH, NOT A VERSION, AND THIS MUST NOT REACH master. Publishing rejects a
# path dependency, and this repository publishes on a Cargo.toml push to the
# default branch, so merging this as it stands breaks the release rather than
# failing loudly somewhere harmless. It is here to measure nago-wss against an
# unreleased nagoya; the version pins go back before any merge.
nago-rustls = { path = "../nago-rustls", optional = true }

# The runtime underneath: the scheduler, sync, time, and since 0.1.4 the
# readiness reactor and its sockets. That reactor was written here and moved
# there, because generational tokens and edge triggered registration are the
# same problem for anything that wants a socket, and none of it was about
# WebSockets.
nagoya = { path = "../nagoya", features = ["reactor"], optional = true }
# Errno constants the client still names (`EPROTO`, `EAI_NONAME`). Name
# resolution itself is `nagoya::reactor::resolve`; this crate no longer binds
# `getaddrinfo`.
libc = { version = "^0.2.189", default-features = false, optional = true }

[dev-dependencies]
# The reactor the benchmarks and the Autobahn server run on. A dev dependency
# rather than a plain one because this crate is generic over its transport: a
# consumer supplies the socket, so only the things here that need a running
# one name it.
nagoya = { path = "../nagoya", features = ["reactor"] }
# Test certificates, generated in process. Same version endpoint-libs uses.
rcgen = "0.14"
# The comparison arm, and the only reason these are here. Same version
# endpoint-libs pins, so the number reflects what the fleet actually runs.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# The third arm: advertises itself as an ultra low latency WebSocket for HFT,
# and gets there with SIMD masking and a good deal of unsafe. Worth measuring
# against precisely because it sits at the other end of that trade from this
# crate, which forbids unsafe in the protocol core.
sockudo-ws = "2.0.1"

# Every one of these drives a real socket, so they need the reactor and say
# so. It is a default feature, so they build without the line; the line is
# what keeps `--no-default-features` from trying to build them and failing on
# an import instead of skipping them.
[[bench]]
name = "echo"
harness = false
required-features = ["reactor"]

[[bench]]
name = "floor"
harness = false
required-features = ["reactor"]

[[bench]]
name = "concurrent"
harness = false
required-features = ["reactor"]

[[bench]]
name = "scale"
harness = false
required-features = ["reactor"]

# Requires the feature rather than tolerating its absence. Without it the
# UTF-8 columns silently measure `core::str::from_utf8`, which is the same
# code as the tungstenite control column, so this crate appears to lose to
# sockudo-ws by three times when what is actually running is the fallback the
# feature exists to replace. A benchmark that measures the wrong thing quietly
# is worse than one that does not build.
[[bench]]
name = "micro"
harness = false
required-features = ["simd-utf8"]

# The echo server the Autobahn suite runs against. Needs the reactor, and says
# so: without the guard, `cargo build --no-default-features` tries to build it
# and fails on imports the feature is what provides.
[[example]]
name = "autobahn_server"
required-features = ["reactor"]

# A diagnostic rather than a benchmark: it attributes the floor to its layers.
[[example]]
name = "floor_probe"
required-features = ["reactor"]
