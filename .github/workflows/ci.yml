name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  portable:
    name: Portable core (${{ matrix.rust }})
    runs-on: ubicloud-standard-2
    strategy:
      matrix:
        rust: [stable, '1.85.0']
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling path dependencies
        # Prefer a nagoya branch of the same name, so a change that spans both
        # crates builds against its own other half rather than against master.
        # This branch needs one: `syscall-counters` is a nagoya feature that
        # does not exist on master or in any published version, and resolving
        # against master fails before a single test runs. Falls back to master,
        # which is the steady state once the paired branch has merged.
        run: |
          git clone --depth 1 --branch "$GITHUB_HEAD_REF" \
            https://github.com/pathscale/nagoya.git ../nagoya \
            || git clone --depth 1 https://github.com/pathscale/nagoya.git ../nagoya
          git clone --depth 1 https://github.com/pathscale/nago-rustls.git ../nago-rustls
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check --lib --no-default-features

  hosted:
    name: Hosted tests
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling path dependencies
        # Prefer a nagoya branch of the same name, so a change that spans both
        # crates builds against its own other half rather than against master.
        # This branch needs one: `syscall-counters` is a nagoya feature that
        # does not exist on master or in any published version, and resolving
        # against master fails before a single test runs. Falls back to master,
        # which is the steady state once the paired branch has merged.
        run: |
          git clone --depth 1 --branch "$GITHUB_HEAD_REF" \
            https://github.com/pathscale/nagoya.git ../nagoya \
            || git clone --depth 1 https://github.com/pathscale/nagoya.git ../nagoya
          git clone --depth 1 https://github.com/pathscale/nago-rustls.git ../nago-rustls
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

  autobahn:
    name: Autobahn
    # GitHub hosted rather than ubicloud, because this job needs the Docker
    # daemon and the image the suite ships as.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone the sibling path dependencies
        # Prefer a nagoya branch of the same name, so a change that spans both
        # crates builds against its own other half rather than against master.
        # This branch needs one: `syscall-counters` is a nagoya feature that
        # does not exist on master or in any published version, and resolving
        # against master fails before a single test runs. Falls back to master,
        # which is the steady state once the paired branch has merged.
        run: |
          git clone --depth 1 --branch "$GITHUB_HEAD_REF" \
            https://github.com/pathscale/nagoya.git ../nagoya \
            || git clone --depth 1 https://github.com/pathscale/nagoya.git ../nagoya
          git clone --depth 1 https://github.com/pathscale/nago-rustls.git ../nago-rustls
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --example autobahn_server
      - name: Start the echo server
        run: |
          nohup ./target/release/examples/autobahn_server > autobahn-server.log 2>&1 &
          # The suite gives up rather than retries, so wait for the port.
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 9001; then exit 0; fi
            sleep 1
          done
          echo "the echo server never came up"
          exit 1
      - name: Run the suite
        run: |
          mkdir -p autobahn/reports
          docker run --rm --network host \
            -v "$PWD/autobahn:/config" \
            crossbario/autobahn-testsuite \
            wstest --mode fuzzingclient --spec /config/fuzzingclient.json
          sudo chown -R "$(id -u):$(id -g)" autobahn/reports
      - name: Check the report
        run: python3 autobahn/check.py autobahn/reports/servers/index.json
      - name: Show what the server logged
        if: failure()
        run: cat autobahn-server.log
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: autobahn/reports/servers/
